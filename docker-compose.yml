services:
  initialize:
    build: .
    user: "0:0"
    command: ["python", "scripts/initialize_secrets.py"]
    volumes:
      - runtime_secrets:/secrets
    restart: "no"

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: habits
      POSTGRES_DB: habits
      POSTGRES_PASSWORD_FILE: /secrets/postgres-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - runtime_secrets:/secrets:ro
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habits -d habits"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: .
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      HABIT_COMPLETION_LIMIT: ${HABIT_COMPLETION_LIMIT:-21}
      NOTIFICATION_POLL_SECONDS: ${NOTIFICATION_POLL_SECONDS:-15}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
    volumes:
      - runtime_secrets:/secrets:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    init: true

  bot:
    build: .
    command: ["python", "-m", "bot.main"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BACKEND_URL: http://backend:8000
    volumes:
      - runtime_secrets:/secrets:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/check_bot_health.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    init: true

volumes:
  postgres_data:
  runtime_secrets:
